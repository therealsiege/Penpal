  issue-planner:
    name: "Issue Planner"
    title: "GitHub Issue Planner"
    pod_role: reviewer
    persona:
      backstory: "Fast architectural thinker. Reads issues, maps code, ships numbered plans."
      style: "Concise, file-path-precise, no fluff"
      catchphrase: ""
    systemPrompt: >
      You are a planning agent. Read the GitHub issue, explore the codebase with
      Read/Glob/Grep, and output a numbered implementation plan with specific file
      paths, function names, and the exact changes needed. Do NOT implement
      anything. Be concise. If something is unclear, output QUESTION: followed
      by your question.
    model: haiku
    skills: [architecture, planning, code-review]
    allowedTools:
      - Read
      - Glob
      - Grep
      - "Bash(gh:*)"
      - "Bash(git:*)"
    defaultRepos: []
    avatar: planner
    desk: { row: 0, col: 0 }
    autonomy: headless

# ── Pod Presets ────────────────────────────────────────────────────────
pod_presets:
  frontend-feature:
    solver: nextjs-frontend
    reviewer: ui-designer
    executor: electron-dev
    description: "Build, review, and test a frontend feature"

  backend-feature:
    solver: fullstack-dev
    reviewer: backend-arch
    executor: electron-dev
    description: "Build, review, and test backend logic"

  full-stack:
    solver: fullstack-dev
    reviewer: backend-arch
    executor: electron-dev
    description: "End-to-end feature with architecture review"

  content-pipeline:
    solver: product-marketer
    reviewer: product-mgr
    executor: exec-assistant
    description: "Create, review, and validate marketing content"

  game-feature:
    solver: videogame-dev
    reviewer: ui-designer
    executor: electron-dev
    description: "Build and review a Phaser game feature"

  mobile-feature:
    solver: expo-mobile
    reviewer: ui-designer
    executor: exec-assistant
    description: "Build and review a mobile feature"

# ── Runtime Profiles ──────────────────────────────────────────────────
# Controls model selection and timeout multipliers for pod execution.
# Default profile is applied to all new issues unless overridden by
# GitHub labels (economic, max) on the issue.
runtime_profiles:
  default_profile: sonnet

  max:
    description: "Max plan — Opus for plan+execute, Sonnet for validate"
    timeout_multiplier: 1
    phases:
      plan:
        model: opus
      execute:
        model: opus
      validate:
        model: sonnet

  economic:
    description: "Local Ollama qwen3-coder:30b — zero cost, more iterations for quality"
    timeout_multiplier: 8
    max_iterations: 5
    max_self_fixes: 3
    ollama_url: "http://localhost:11434"
    phases:
      plan:
        model: ollama:qwen3-coder:30b
      execute:
        model: ollama:qwen3-coder:30b
      validate:
        model: ollama:qwen3-coder:30b

  sonnet:
    description: "Balanced — Sonnet for all three phases"
    timeout_multiplier: 1.5
    phases:
      plan:
        model: sonnet
      execute:
        model: sonnet
      validate:
        model: sonnet

# ── Per-Phase MCP Tool Allowlisting ───────────────────────────────────
# Restricts which MCP profiles are available per pod phase.
# If not specified, agents use their own default mcpProfile.
phase_tools:
  plan:
    - developer
    - nextjs
    - mobile
    - embedded
    - game-dev
    - ui-reviewer
    - pm-reviewer
    - serena
    - context7
    - github
    - graphite-atlas
  execute:
    - developer
    - nextjs
    - mobile
    - embedded
    - game-dev
    - marketer
    - executive
    - serena
    - context7
    - github
    - graphite-atlas
  validate:
    - qa-executor
    - playwright
    - github
