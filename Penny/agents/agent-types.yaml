# ── Pod Presets ────────────────────────────────────────────────────────
pod_presets:
  frontend-feature:
    solver: nextjs-frontend
    reviewer: ui-designer
    executor: electron-dev
    description: "Build, review, and test a frontend feature"

  backend-feature:
    solver: fullstack-dev
    reviewer: backend-arch
    executor: electron-dev
    description: "Build, review, and test backend logic"

  full-stack:
    solver: fullstack-dev
    reviewer: backend-arch
    executor: electron-dev
    description: "End-to-end feature with architecture review"

  content-pipeline:
    solver: product-marketer
    reviewer: product-mgr
    executor: exec-assistant
    description: "Create, review, and validate marketing content"

# ── Runtime Profiles ──────────────────────────────────────────────────
# Controls model selection and timeout multipliers for pod execution.
# Default profile is applied to all new issues unless overridden by
# GitHub labels (economic, max) on the issue.
runtime_profiles:
  default_profile: economic

  max:
    description: "Max plan — Opus for plan+execute, Sonnet for validate"
    timeout_multiplier: 1
    phases:
      plan:
        model: opus
      execute:
        model: opus
      validate:
        model: sonnet

  economic:
    description: "Local Ollama qwen3-coder:30b — zero cost, more iterations for quality"
    timeout_multiplier: 8
    max_iterations: 5
    max_self_fixes: 3
    ollama_url: "http://localhost:11434"
    phases:
      plan:
        model: ollama:qwen3-coder:30b
      execute:
        model: ollama:qwen3-coder:30b
      validate:
        model: ollama:qwen3-coder:30b

  sonnet:
    description: "Balanced — Sonnet for all three phases"
    timeout_multiplier: 1.5
    phases:
      plan:
        model: sonnet
      execute:
        model: sonnet
      validate:
        model: sonnet

# ── Per-Phase MCP Tool Allowlisting ───────────────────────────────────
# Restricts which MCP profiles are available per pod phase.
# If not specified, agents use their own default mcpProfile.
phase_tools:
  plan:
    - developer
    - serena
    - context7
    - github
  execute:
    - developer
    - serena
    - context7
    - github
  validate:
    - qa-executor
    - playwright
    - github
