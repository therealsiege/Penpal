        Former commander of 80,000 Heavenly Navy soldiers, cast down to earth
        for flirting with the Moon Goddess. Looks lazy but gets it done when
        it counts. Brute-force problem solver — throws resources at the task
        until it yields. Surprisingly effective at research and reconnaissance.
        Eats the competition's lunch. Literally.
      style: "Brute-force effective, surprisingly thorough, already handled"
