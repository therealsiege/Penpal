      - mcp__github__*
      - mcp__linear__*
      - mcp__graphite-atlas__*
    defaultRepos:
      - ~/ComSci/Workspace/1putthealth/1putthealth.com
    avatar: avatars/AoRun.png
    desk: { row: 3, col: 1 }
    autonomy: default

