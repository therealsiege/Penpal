jobs:
  health-check:
    description: Verify Memgraph, Qdrant, and API keys are available
    command: npm run health
    cron: "*/30 * * * *"
    timeout: 30
    enabled: true
  rss-ingest:
    description: Ingest RSS feeds + Google Alerts for all ventures
    command: npm run ingest:all
    cron: 0 6,14 * * *
    timeout: 300
    enabled: true
  daily-briefing:
    description: Generate daily intelligence briefing
    command: npm run briefing
    cron: 30 6 * * 1-5
    timeout: 120
    enabled: false
    depends_on:
      - rss-ingest
  npi-enrich:
    description: Enrich unenriched NPI leads via Firecrawl
    command: npm run npi:enrich -- --limit 25
    cron: 0 3 * * 6
    timeout: 600
    enabled: true
  etl-full:
    description: Full ETL pipeline rebuild (vault parse + graph + embeddings)
    command: npm run etl
    cron: 0 2 * * 0
    timeout: 900
    enabled: true
  memory-sync:
    description: Sync MCP Knowledge Graph Memory into Memgraph
    command: npm run memory:sync
    cron: "*/15 * * * *"
    timeout: 60
    enabled: true
  weekly-digest:
    description: Generate weekly eval digest report
    command: cd ../Penny && npx electron . --run-digest
    cron: "0 8 * * 1"
    timeout: 120
    enabled: false
