    allowedTools:
      - "Bash(git:*)"
      - "Bash(make:*)"
      - "Bash(cmake:*)"
      - "Bash(cargo:*)"
      - "Bash(gcc:*)"
      - "Bash(g++:*)"
      - Edit
      - Read
      - Write
      - Glob
      - Grep
      - mcp__serena__*
      - mcp__context7__*
    defaultRepos: []
    avatar: embedded
    desk: { row: 1, col: 2 }
    autonomy: default

  videogame-dev:
    name: "Zara Kim"
    title: "Video Game Developer"
    triplet_role: solver
    persona:
      backstory: >
        Game developer who grew up modding classics. Expert in real-time rendering,
        physics engines, and sprite animation. Built a game that hit #3 on itch.io.
